<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8001a" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <script>
      // Tema elegido en Configuración (claro si no se eligió nada), aplicado antes del primer render para que no parpadee.
      document.documentElement.dataset.theme = 'light'
      try {
        var t = localStorage.getItem('chipa-tia-tema')
        if (t === 'oscuro') document.documentElement.dataset.theme = 'dark'
        else if (t === 'sistema') delete document.documentElement.dataset.theme
        var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', oscuro ? '#c8102e' : '#b8001a')
      } catch (e) {}
    </script>
    <title>Chipa Tía Producción</title>
    <script type="module" crossorigin src="./assets/index-Bc8Vy3la.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DLAhe9mx.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
