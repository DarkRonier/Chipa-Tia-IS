<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8001a" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <script>
      // Tema elegido en Configuración, aplicado antes del primer render para que no parpadee.
      try {
        var t = localStorage.getItem('chipa-tia-tema')
        if (t === 'claro') document.documentElement.dataset.theme = 'light'
        else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark'
        var oscuro = t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', oscuro ? '#c8102e' : '#b8001a')
      } catch (e) {}
    </script>
    <title>Chipa Tía Producción</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
