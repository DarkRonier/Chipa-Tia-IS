name: Publicar en Cloudflare

# Publica el sistema real (Worker + D1 + R2) en cada push a main.
# Necesita, en Settings → Secrets and variables → Actions:
#   - variable CLOUDFLARE_ACCOUNT_ID y secreto CLOUDFLARE_API_TOKEN (sin ellos este workflow no hace nada);
#   - opcionales: secreto RESEND_API_KEY y variable CORREO_REMITENTE (correos de reportes);
#   - secreto ADMIN_CLAVE_INICIAL para crear el usuario admin (a mano: Actions → este workflow → Run workflow).
# Ver docs/despliegue.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      crear_admin:
        description: 'Crear o reiniciar el usuario admin con ADMIN_CLAVE_INICIAL'
        type: boolean
        default: false
      clave_encargados:
        description: 'Crear los cuatro encargados de sector con esta contraseña (vacío = no crear)'
        type: string
        default: ''

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  publicar:
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HAY_RESEND: ${{ secrets.RESEND_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Base D1 y bucket R2
        run: node scripts/preparar-cloudflare.ts
      - name: Migraciones de la base
        run: npx wrangler d1 migrations apply chipa-tia --remote
      - name: Publicar el Worker
        env:
          CORREO_REMITENTE: ${{ vars.CORREO_REMITENTE }}
        run: |
          if [ -n "$CORREO_REMITENTE" ]; then
            npx wrangler deploy --var "CORREO_REMITENTE:$CORREO_REMITENTE"
          else
            npx wrangler deploy
          fi
      - name: Clave de Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        if: env.HAY_RESEND == 'true'
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
      - name: Usuario admin
        if: github.event_name == 'workflow_dispatch' && inputs.crear_admin
        env:
          ADMIN_CLAVE_INICIAL: ${{ secrets.ADMIN_CLAVE_INICIAL }}
        run: npm run crear-admin -- "$ADMIN_CLAVE_INICIAL" --remoto
      - name: Encargados de sector
        if: github.event_name == 'workflow_dispatch' && inputs.clave_encargados != ''
        env:
          CLAVE_ENCARGADOS: ${{ inputs.clave_encargados }}
        run: npm run crear-encargados -- "$CLAVE_ENCARGADOS" --remoto
